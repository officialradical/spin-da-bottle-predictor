
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spin Da Bottle Predictor</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#20140f;color:white;font-family:Arial,sans-serif}
.app{max-width:520px;margin:auto;min-height:100vh}
.top{height:78px;background:#e91d25;display:flex;align-items:center;padding:15px}
.title{font-size:20px;font-weight:bold}
.game{text-align:center;padding:18px 12px 30px;background:radial-gradient(circle,#704932,#24160f)}
h1{font-size:27px}
.sub{color:#d5c4b8;font-size:13px}
.voucher{max-width:395px;margin:16px auto;background:#17110e;border-radius:15px;padding:13px;display:flex;align-items:center;gap:12px;text-align:left}
.vtext{flex:1}
.vtext b,.vtext span{display:block}
.vtext span{font-size:12px;color:#aaa}
.count{font-size:22px;color:#ffd45c;font-weight:bold}
.board{position:relative;width:min(410px,92vw);aspect-ratio:1;margin:24px auto;border-radius:50%;background:linear-gradient(#72c900 50%,#f09a00 50%);border:10px solid #9a5227}
.upword,.downword{position:absolute;left:0;right:0;font-size:62px;font-weight:bold;color:#ffffff8c}
.upword{top:22%}
.downword{top:63%}
.bottle{position:absolute;left:50%;top:50%;width:78%;height:54px;transform:translate(-50%,-50%);background:linear-gradient(#38ad20,#087b11);border:3px solid #064e0b;border-radius:25px;z-index:4}
.bottle:before{content:"";position:absolute;right:-34px;top:11px;width:40px;height:26px;background:#168719;border:3px solid #064e0b;border-left:0}
.result{background:#120e0b;border-radius:16px;padding:14px;max-width:395px;margin:auto}
.caption{font-size:11px;letter-spacing:2px;color:#bdb0a7}
.answer{font-size:42px;font-weight:bold;margin:5px}
.up{color:#63df45}
.down{color:#ff9d16}
button{width:100%;border:0;border-radius:13px;padding:16px;font-size:17px;font-weight:bold;cursor:pointer}
.spin{margin-top:15px;background:#e91d25;color:white}
.buy{margin-top:10px;background:#ffd34e;color:#23160b}
.locked{background:#555}
.note{font-size:11px;color:#b9aaa0;margin:14px auto}
.modal{position:fixed;inset:0;background:#000b;display:none;align-items:flex-end;justify-content:center;z-index:20}
.modal.show{display:flex}
.sheet{width:min(520px,100%);background:#17181d;border-radius:24px 24px 0 0;padding:24px 18px 30px;text-align:center}
.packs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}
.pack{background:#252831;border:1px solid #383b44;border-radius:14px;padding:15px;color:white}
.pack strong{display:block;font-size:21px;color:#ffd45c}
.pack small{color:#aaa}
.close{background:#333;color:white}
#paymentStatus{color:#ffd45c;font-size:13px;margin:12px}
.top-games{max-width:1100px;margin:28px auto;padding:0 16px}
.game-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.game-card{aspect-ratio:1;background:linear-gradient(135deg,#7b3926,#e79b20)}
</style>
</head>

<body>

<div class="app">
<header class="top">
<span class="title">Spin Da Bottle Predictor</span>
</header>

<main class="game">
<h1>SPIN DA BOTTLE</h1>
<div class="sub">UP / DOWN</div>

<div class="voucher">
<div>🎟️</div>
<div class="vtext">
<b>Spin Vouchers</b>
<span>Get a voucher before you spin</span>
</div>
<div class="count" id="count">0</div>
</div>

<div class="board">
<div class="upword">UP</div>
<div class="downword">DOWN</div>
<div class="bottle" id="bottle"></div>
</div>

<div class="result">
<div class="caption">RESULT</div>
<div id="answer" class="answer">—</div>
<div id="round" class="sub">Buy a voucher before spinning</div>
</div>

<button id="spin" class="spin locked" onclick="spin()" disabled>
🔒 GET A VOUCHER TO SPIN
</button>

<button class="buy" onclick="openBuy()">
🎟️ BUY VOUCHERS
</button>

<div class="note">
Vouchers are credited only after confirmed payment.
</div>
</main>
</div>

<div class="modal" id="modal">
<div class="sheet">
<h2>Buy Spin Vouchers</h2>
<div class="sub">Choose your voucher package</div>

<div class="packs">
<button class="pack" onclick="payForVouchers(3)">
<strong>3 Vouchers</strong>
<small>GH₵300</small>
</button>

<button class="pack" onclick="payForVouchers(5)">
<strong>5 Vouchers</strong>
<small>GH₵500</small>
</button>

<button class="pack" onclick="payForVouchers(10)">
<strong>10 Vouchers</strong>
<small>GH₵800</small>
</button>

<button class="pack" onclick="payForVouchers(25)">
<strong>25 Vouchers</strong>
<small>GH₵1,700</small>
</button>
</div>

<div id="paymentStatus">
Select a package to continue.
</div>

<button class="close" onclick="closeBuy()">Cancel</button>
</div>
</div>

<script>
"use strict";

let vouchers = 0;
let round = 0;
let spinning = false;

function update(){
  document.getElementById("count").textContent = vouchers;

  const button = document.getElementById("spin");
  button.disabled = vouchers < 1 || spinning;

  button.textContent = spinning
    ? "SPINNING..."
    : vouchers > 0
    ? "SPIN BOTTLE"
    : "🔒 GET A VOUCHER TO SPIN";
}

function openBuy(){
  document.getElementById("modal").classList.add("show");
}

function closeBuy(){
  document.getElementById("modal").classList.remove("show");
}

function spin(){
  if(spinning || vouchers < 1) return;

  spinning = true;
  vouchers--;
  round++;
  update();

  const bottle = document.getElementById("bottle");
  const answer = document.getElementById("answer");
  const roundText = document.getElementById("round");

  const result = Math.random() < 0.5 ? "UP" : "DOWN";
  const angle = result === "UP" ? 270 : 90;

  answer.textContent = "...";
  roundText.textContent = "Spinning...";

  const animation = bottle.animate([
    {transform:"translate(-50%,-50%) rotate(0deg)"},
    {transform:"translate(-50%,-50%) rotate(720deg)"},
    {transform:`translate(-50%,-50%) rotate(${angle+720}deg)`}
  ],{
    duration:2200,
    easing:"cubic-bezier(.12,.78,.18,1)",
    fill:"forwards"
  });

  animation.onfinish = function(){
    bottle.style.transform =
      `translate(-50%,-50%) rotate(${angle}deg)`;

    answer.textContent = result;
    answer.className = "answer " + result.toLowerCase();

    roundText.textContent = "Round " + round + " • Voucher used";

    spinning = false;
    update();
  };
}

async function payForVouchers(number){

  const prices = {
    3:300,
    5:500,
    10:800,
    25:1700
  };

  const quantity = Number(number);
  const amount = prices[quantity];

  const status = document.getElementById("paymentStatus");

  if(!amount){
    status.textContent = "Invalid voucher package.";
    return;
  }

  status.textContent = "Connecting to payment service...";

  const SUPABASE_URL =
    "https://fcxdazlpeagmuagsayja.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_DpRoplNSvHveMpStM5NolQ_ofoVRbeL";

  try{

    const response = await fetch(
      SUPABASE_URL + "/functions/v1/create-payment",
      {
        method:"POST",

        headers:{
          "Content-Type":"application/json",
          "apikey":SUPABASE_KEY,
          "Authorization":"Bearer " + SUPABASE_KEY
        },

        body:JSON.stringify({
          vouchers:quantity,
          amount:amount,
          email:"customer@spinbottle.example",
          name:"Spin Da Bottle Customer"
        })
      }
    );

    const data = await response.json();

    if(!response.ok || !data.checkout_url){
      status.textContent =
        data.error || "Payment could not be started.";
      console.error(data);
      return;
    }

    window.location.href = data.checkout_url;

  }catch(error){

    console.error(error);

    status.textContent =
      "Connection error. Please try again.";

  }
}

update();
</script>

</body>
</html>
